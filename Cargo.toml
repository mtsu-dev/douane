[workspace]
resolver = "3"
members = ["crates/douane", "crates/douanectl"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mtsu-dev/douane"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
rusqlite = { version = "0.37", features = ["bundled", "time"] }
axum = { version = "0.8", features = ["http2", "multipart", "ws"] }
tower-http = { version = "0.6", features = ["trace", "limit", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "multipart"] }
http = "1"
bytes = "1"
futures-util = "0.3"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
include_dir = "0.7"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

